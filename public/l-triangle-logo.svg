<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="100%" height="100%">
  <defs>
    <!-- Glowing Red Filter -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>


  <!-- Outer Neon Red Inverted Triangle -->
  <polygon 
    points="180,240 820,240 500,980" 
    fill="none" 
    stroke="#ff1e2e" 
    stroke-width="7" 
    stroke-linejoin="miter"
    filter="url(#redGlow)"
  />

  <!-- Top Center Circular Emblem (Red Crescent Wave Crest) -->
  <g transform="translate(500, 115)" filter="url(#redGlow)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ff1e2e" stroke-width="4.5" />
    <!-- Stylized internal wave/crescent curves (100% transparent cutout with evenodd) -->
    <path 
      d="M -30,12 C -20,-28 10,-38 32,-15 C 20,-12 12,0 18,16 C 5,8 -8,12 -14,24 C -22,24 -28,20 -30,12 Z M -18,2 C -10,-18 12,-22 24,-8 C 15,-6 8,2 10,12 C 0,6 -10,8 -14,16 Z" 
      fill="#ff1e2e" 
      fill-rule="evenodd"
    />
    <circle cx="-6" cy="-4" r="5" fill="#ff1e2e" />
  </g>

  <!-- Inner Dotted Inverted Triangle -->
  <g fill="#ff1e2e" filter="url(#redGlow)">
    <!-- Top Horizontal Dots (Left side) -->
    <circle cx="230" cy="120" r="6" />
    <circle cx="255" cy="120" r="6" />
    <circle cx="280" cy="120" r="6" />
    <circle cx="305" cy="120" r="6" />
    <circle cx="330" cy="120" r="6" />
    <circle cx="355" cy="120" r="6" />
    <circle cx="380" cy="120" r="6" />
    <circle cx="405" cy="120" r="6" />

    <!-- Top Horizontal Dots (Right side) -->
    <circle cx="595" cy="120" r="6" />
    <circle cx="620" cy="120" r="6" />
    <circle cx="645" cy="120" r="6" />
    <circle cx="670" cy="120" r="6" />
    <circle cx="695" cy="120" r="6" />
    <circle cx="720" cy="120" r="6" />
    <circle cx="745" cy="120" r="6" />
    <circle cx="770" cy="120" r="6" />

    <!-- Left Diagonal Dots -->
    <circle cx="760" cy="165" r="6" />
    <circle cx="745" cy="210" r="6" />
    <circle cx="730" cy="255" r="6" />
    <circle cx="715" cy="300" r="6" />
    <circle cx="700" cy="345" r="6" />
    <circle cx="685" cy="390" r="6" />
    <circle cx="670" cy="435" r="6" />
    <circle cx="655" cy="480" r="6" />
    <circle cx="640" cy="525" r="6" />
    <circle cx="625" cy="570" r="6" />
    <circle cx="610" cy="615" r="6" />
    <circle cx="595" cy="660" r="6" />
    <circle cx="580" cy="705" r="6" />
    <circle cx="565" cy="750" r="6" />
    <circle cx="550" cy="795" r="6" />
    <circle cx="535" cy="840" r="6" />
    <circle cx="520" cy="885" r="6" />
    <circle cx="505" cy="930" r="6" />

    <!-- Right Diagonal Dots -->
    <circle cx="240" cy="165" r="6" />
    <circle cx="255" cy="210" r="6" />
    <circle cx="270" cy="255" r="6" />
    <circle cx="285" cy="300" r="6" />
    <circle cx="300" cy="345" r="6" />
    <circle cx="315" cy="390" r="6" />
    <circle cx="330" cy="435" r="6" />
    <circle cx="345" cy="480" r="6" />
    <circle cx="360" cy="525" r="6" />
    <circle cx="375" cy="570" r="6" />
    <circle cx="390" cy="615" r="6" />
    <circle cx="405" cy="660" r="6" />
    <circle cx="420" cy="705" r="6" />
    <circle cx="435" cy="750" r="6" />
    <circle cx="450" cy="795" r="6" />
    <circle cx="465" cy="840" r="6" />
    <circle cx="480" cy="885" r="6" />
    <circle cx="495" cy="930" r="6" />
  </g>

  <!-- Central Clean Crisp Letter "L" -->
  <text 
    x="500" 
    y="445" 
    font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" 
    font-size="150" 
    font-weight="600" 
    fill="#ffffff" 
    text-anchor="middle"
    dominant-baseline="central"
    filter="drop-shadow(0 0 8px rgba(255,255,255,0.7))"
  >
    L
  </text>

  <!-- Red Underline Bar below L -->
  <rect 
    x="450" 
    y="515" 
    width="100" 
    height="6" 
    rx="3" 
    fill="#ff1e2e" 
    filter="url(#redGlow)" 
  />
</svg>
