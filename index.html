<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L — Desktop Assistant</title>
    <!-- Modern Typography: Inter, JetBrains Mono, and Cinzel Decorative -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="L — Premium Windows Desktop Utility and Persistent Floating Assistant." />
    <style>
      html, body {
        background-color: #07080a;
        color: #f1f2f4;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('[L Global Error]', e.message, e.filename, e.lineno, e.error);
        var b = document.getElementById('global-err-box');
        if (!b) {
          b = document.createElement('div');
          b.id = 'global-err-box';
          b.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;z-index:999999;background:#1a0004;color:#ff4466;border:2px solid #ff1e2e;padding:12px;font-family:monospace;font-size:11px;max-height:160px;overflow:auto;box-shadow:4px 4px 0 #000;';
          document.body.appendChild(b);
        }
        b.innerHTML = '<strong>[CRITICAL ERROR]</strong> ' + (e.message || e) + '<br><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>';
      });
    </script>
  </head>
  <body class="bg-[#07080a] select-none overflow-x-hidden overflow-y-auto m-0 p-0 text-slate-100 antialiased font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
